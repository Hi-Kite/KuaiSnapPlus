<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Speed Check：粗对勾 + 一条缩短的基准线 -->
  <!-- 基准线比对勾的水平跨度短，重心偏左上，用不对称制造张力；
       它同时暗示「卷面」与「扫描基准」，点出这是个拍照搜题工具 -->
  <path d="M26 51 L41 66 L74 33" stroke="currentColor" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="26" y1="82" x2="61" y2="82" stroke="currentColor" stroke-width="5.5"
        stroke-linecap="round" opacity="0.35"/>
</svg>
